<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo/unifi-2.0-favicon.svg" type="image/svg+xml" />
    <!--head-->
    <script>
      try {
        const preference = localStorage.getItem('unifi-docs-theme')
        document.documentElement.dataset.theme = preference || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {}
    </script>
    <script type="module" src="/src/client.js"></script>
  </head>
  <body><!--body--></body>
</html>
