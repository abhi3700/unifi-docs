<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/logo/unifi-docs-favicon.png" type="image/png" sizes="64x64" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/docs-192.png" />
    <meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090f1c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="UniFi Docs" />
    <script src="/install.js"></script>
    <!--head-->
    <style>
      #docs-loading { display: none; }
      [data-docs-loading] body > :not(#docs-loading) { visibility: hidden; }
      [data-docs-loading] #docs-loading {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 12px;
        margin: 0;
        background: #fff;
        color: #101a32;
        font: 500 15px/1.6 system-ui, sans-serif;
      }
      [data-theme="dark"] #docs-loading { background: #090f1c; color: #f2f6ff; }
      #docs-loading::before {
        content: "";
        width: 18px;
        height: 18px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
      }
      @media (prefers-reduced-motion: no-preference) {
        #docs-loading::before { animation: docs-loading-spin .8s linear infinite; }
      }
      @keyframes docs-loading-spin { to { transform: rotate(1turn); } }
    </style>
    <script>
      const root = document.documentElement
      if (new URLSearchParams(location.search).get('embed') === 'playground') {
        root.dataset.playgroundEmbed = ''
      }
      try {
        const preference = localStorage.getItem('unifi-docs-theme')
        root.dataset.theme = preference || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch {}

      root.dataset.docsLoading = ''
      globalThis.docsStylesReady = new Promise((resolve) => {
        function settleStyles(event) {
          const link = event.target
          if (link.id !== 'docs-styles') return
          if (event.type === 'load') link.media = 'all'
          delete root.dataset.docsLoading
          document.removeEventListener('load', settleStyles, true)
          document.removeEventListener('error', settleStyles, true)
          resolve()
        }
        document.addEventListener('load', settleStyles, true)
        document.addEventListener('error', settleStyles, true)
      })
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/client.js"></script>
  </head>
  <body>
    <p id="docs-loading" role="status">Loading docs ...</p>
    <!--body-->
  </body>
</html>
